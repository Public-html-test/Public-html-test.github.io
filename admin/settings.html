<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تنظیمات | HINA Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="logo"><a href="../index.html"><img src="../assets/logo-sm.png" alt="HINA" class="logo-img"></a></div>
      <nav class="admin-nav">
        <a href="index.html">داشبورد</a>
        <a href="products.html">محصولات</a>
        <a href="orders.html">سفارش‌ها</a>
        <a href="customers.html">مشتریان</a>
        <a href="content.html">محتوای سایت</a>
        <a href="reports.html">گزارش‌ها</a>
        <a href="settings.html" class="active">تنظیمات</a>
        <a href="../index.html" style="margin-top:24px;opacity:0.7;">بازگشت به فروشگاه</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="admin-header"><h1>تنظیمات فروشگاه</h1></div>
      <div class="admin-table-wrap" style="padding:28px;max-width:640px;">
        <form onsubmit="event.preventDefault();localStorage.setItem('hina_settings',JSON.stringify({name:document.getElementById('sName').value,phone:document.getElementById('sPhone').value,email:document.getElementById('sEmail').value,ship:document.getElementById('sShip').value,free:document.getElementById('sFree').value}));alert('تنظیمات ذخیره شد');">
          <div class="form-group"><label>نام فروشگاه</label><input type="text" id="sName" value="HINA"></div>
          <div class="form-group"><label>تلفن پشتیبانی</label><input type="text" id="sPhone" value="۰۲۱-۹۱۰۰۱۲۳۴"></div>
          <div class="form-group"><label>ایمیل</label><input type="email" id="sEmail" value="info@hina-shoes.ir"></div>
          <div class="form-group"><label>هزینه ارسال پیش‌فرض (تومان)</label><input type="number" id="sShip" value="45000"></div>
          <div class="form-group"><label>حداقل مبلغ ارسال رایگان (تومان)</label><input type="number" id="sFree" value="1500000"></div>
          <div class="form-group"><label>پیام بالای سایت (تاپ‌بار)</label><input type="text" id="sTop" value="ارسال رایگان به سراسر کشور"></div>
          <button type="submit" class="btn btn-primary">ذخیره تنظیمات</button>
        </form>
      </div>
    </main>
  </div>
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('hina_settings')||'{}');
      if (s.name) document.getElementById('sName').value = s.name;
      if (s.phone) document.getElementById('sPhone').value = s.phone;
      if (s.email) document.getElementById('sEmail').value = s.email;
      if (s.ship) document.getElementById('sShip').value = s.ship;
      if (s.free) document.getElementById('sFree').value = s.free;
    } catch(e){}
  </script>
</body>
</html>
